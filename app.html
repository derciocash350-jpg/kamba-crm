<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kamba CRM</title>
<meta name="theme-color" content="#0d7a6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<style>
/* Layout: barra lateral fixa + área de trabalho; em ecrãs estreitos a barra passa para o topo */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --fg:#13201e; --muted:#5d6e6b; --line:#dce4e3;
  --accent:#0d7a6e; --accent-ink:#ffffff; --accent-soft:#dff1ee;
  --good:#1a7f4b; --good-soft:#dcf2e5; --warn:#a15c07; --warn-soft:#fbecd2; --bad:#b4332b; --bad-soft:#fbe0dd;
  --shadow:0 1px 2px rgba(19,32,30,.06),0 8px 24px rgba(19,32,30,.06);
  --f-display:'Space Grotesk',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1716; --surface:#152220; --fg:#e6f0ee; --muted:#93a8a4; --line:#263a37;
  --accent:#3fc5b4; --accent-ink:#06211d; --accent-soft:#18403b;
  --good:#5fd394; --good-soft:#163a28; --warn:#f0b75a; --warn-soft:#3d2d10; --bad:#ff8c82; --bad-soft:#431b18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1716; --surface:#152220; --fg:#e6f0ee; --muted:#93a8a4; --line:#263a37;
  --accent:#3fc5b4; --accent-ink:#06211d; --accent-soft:#18403b;
  --good:#5fd394; --good-soft:#163a28; --warn:#f0b75a; --warn-soft:#3d2d10; --bad:#ff8c82; --bad-soft:#431b18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);margin:0;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto;padding-block:20px}
.side{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font:700 18px var(--f-display)}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand svg{width:16px;height:16px;stroke:var(--accent-ink);fill:none;stroke-width:2.2}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
nav a:hover{background:var(--accent-soft);color:var(--fg)}
nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav a .n{margin-left:auto;font-size:12px;opacity:.85}
.note{font-size:12px;color:var(--muted);line-height:1.45}
main{min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:26px}
.head p{margin:2px 0 0;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font:700 26px var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px}
.card h2{font-size:16px;margin-bottom:12px}
.fun{display:grid;gap:10px}
.fun .r{display:grid;grid-template-columns:110px 1fr 110px;gap:10px;align-items:center}
.fun .bar{height:22px;background:var(--bg);border-radius:6px;overflow:hidden}
.fun .bar b{display:block;height:100%;background:var(--accent);border-radius:6px;min-width:4px}
.fun .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.fun .cnt{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.list .it:first-child{border-top:0}
.grow{flex:1;min-width:0}
.t{font-weight:500;overflow-wrap:anywhere}
.m{color:var(--muted);font-size:12px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.mut{background:var(--bg);color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.tools input{flex:1;min-width:180px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-top:1px solid var(--line)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--accent-soft)}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:280px}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col h3{font-size:14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col .tot{font-size:12px;color:var(--muted);font-weight:400;font-family:var(--f-body)}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:grab;box-shadow:var(--shadow)}
.deal:active{cursor:grabbing}
.mv{display:none;margin-top:8px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
@media (hover:none){.mv{display:block}}
.deal .val{font:600 15px var(--f-display);margin-top:6px;font-variant-numeric:tabular-nums}
.tk{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.tk:first-child{border-top:0}
.tk input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.tk.done .t{text-decoration:line-through;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(8,16,15,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;z-index:20}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;padding:20px;margin-top:4vh;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal h2{font-size:20px;margin-bottom:14px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fg label.w{grid-column:1/-1}
.fg input,.fg select,.fg textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);font-size:14px;min-width:0;width:100%}
.fg textarea{min-height:70px;resize:vertical}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.acts .sp{margin-right:auto}
.rel{margin-top:14px;font-size:12px;color:var(--muted)}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{position:static;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap}
  nav{flex-direction:row;overflow-x:auto;max-width:100%}
  nav a{padding:8px 10px}
  .note{display:none}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .fun .r{grid-template-columns:90px 1fr 90px}
  .fg{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.card,.deal{transition:border-color .15s}}

[hidden]{display:none!important}
#auth{min-height:100vh;display:grid;place-items:center;padding:24px 0}
.authbox{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.authbox form{display:flex;flex-direction:column;gap:12px}
.authbox label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.authbox input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;width:100%}
.authbox .msg{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.authbox .msg.ok{background:var(--good-soft);color:var(--good)}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500}
.who{display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.who span{overflow-wrap:anywhere}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:40;max-width:90vw}
#toast.bad{background:var(--bad);color:#fff}

#net{position:sticky;top:0;z-index:15;background:var(--warn-soft);color:var(--warn);padding:8px 16px;font-size:13px;text-align:center;margin-inline:-16px}
.fg div.w{grid-column:1/-1}
.modal.wide{max-width:780px}
.wa{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 9px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:12px;margin-top:6px;color:var(--accent);font-weight:500}
.wa:hover{border-color:var(--accent)}
.qh,.qi{display:grid;grid-template-columns:minmax(0,1fr) 72px 120px 36px;gap:6px;align-items:center}
.qh{font-size:12px;color:var(--muted);margin-bottom:4px}
.qi{margin-bottom:6px}
.qi input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);min-width:0;width:100%}
.qi .btn{padding:6px 0}
#qtot{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13px}
.doc-ov{position:fixed;inset:0;background:#dfe6e5;z-index:50;overflow:auto;padding:12px}
.doc-tools{max-width:794px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.doc-tools .m{color:#566865}
.doc{background:#fff;color:#111;max-width:794px;margin:12px auto;padding:44px;box-shadow:0 2px 24px rgba(0,0,0,.12);font:14px/1.5 Inter,system-ui,sans-serif}
.doc h1{font:700 26px 'Space Grotesk',system-ui,sans-serif;margin:0;color:#0b4f48;letter-spacing:.02em}
.doc .dh{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.doc .dh>div{min-width:0}
.doc .dh .emp b{font-size:17px}
.doc .meta{text-align:right}
.doc .cli{margin-bottom:20px;padding:12px 14px;background:#f3f6f6;border-radius:8px}
.doc h2{font:600 16px 'Space Grotesk',system-ui,sans-serif;margin:0 0 10px;color:#111}
.doc .dt{overflow-x:auto}
.doc table{width:100%;border-collapse:collapse;min-width:0}
.doc th{background:#0b4f48;color:#fff;text-align:left;font-size:12px;padding:8px 10px;text-transform:none;letter-spacing:0}
.doc td{padding:8px 10px;border-top:1px solid #dfe6e5;color:#111}
.doc .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc tbody tr{cursor:default}.doc tbody tr:hover{background:none}
.doc .tt{margin:14px 0 0 auto;width:min(320px,100%)}
.doc .tt div{display:flex;justify-content:space-between;padding:4px 10px;font-variant-numeric:tabular-nums}
.doc .tt .g{background:#0b4f48;color:#fff;font-weight:700;border-radius:6px;margin-top:4px;padding:8px 10px}
.doc .cond{margin-top:24px;font-size:13px;white-space:pre-wrap}
.doc .fiscal{margin-top:28px;font-size:12px;color:#566865;border-top:1px solid #dfe6e5;padding-top:10px}
.doc .aviso{background:#fbecd2;color:#7a4a00;padding:8px 12px;border-radius:8px;margin-bottom:16px;font-size:13px}
@media (max-width:600px){.doc{padding:20px}.qh,.qi{grid-template-columns:minmax(0,1fr) 58px 92px 32px}}
@media print{
  body>*:not(#doc){display:none!important}
  #doc{position:static!important;background:#fff!important;padding:0!important;overflow:visible!important}
  .doc-tools,.no-print{display:none!important}
  .doc{box-shadow:none!important;margin:0!important;padding:0!important;max-width:none!important}
  .doc th,.doc .tt .g{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{margin:16mm}
}
</style>

async function save(){
  if(saving)return;saving=true;
  try{
    let quotes=false;
    while(queue.length){
      const j=queue[0];
      const r=j.op==='up'?(j.k==='team'?await sb.from('equipa').update({papel:j.row.papel}).eq('email',j.row.email):j.k==='empresa'?await sb.from('empresas').update(j.row).eq('id',j.id):await sb.from(TBL[j.k]).upsert(j.row)):await sb.from(TBL[j.k]).delete().eq(j.k==='team'?'email':'id',j.id);
      if(r.error){
        if(isNet(r.error)){offline=true;persistQ();toast('Sem ligação. As alterações ficam guardadas neste aparelho.');return}
        queue=[];persistQ();toast('Não foi possível guardar: '+r.error.message,true);await loadAll();render();return;

      if(j.k==='orcamentos')quotes=true;

  const err=c.error||d.error||t.error||e.error||o.error||em.error;

function editMember(){
  const pw=genPw();
  modal('Criar perfil',inp('Email da pessoa','f_em','','email','w')+sel('Função','f_pp','<option value="vendedor">Vendedor</option><option value="gestor">Gestor</option><option value="admin">Administrador</option>','w')+inp('Palavra-passe temporária','f_pw',pw,'text','w')+'<div class="m w" style="font-size:12px">A pessoa entra com este email e palavra-passe e pode mudá-la depois. Só vê os dados da tua empresa.</div>',
    g=>{const em=g('f_em').toLowerCase(),pp=g('f_pp'),pass=g('f_pw');
      if(!/^\S+@\S+\.\S+$/.test(em)){reqName(()=>'','f_em','Indica um email válido');return false}
      if(pass.length<8){reqName(()=>'','f_pw','Mínimo 8 caracteres');return false}
      if(db.team.some(m=>m.email.toLowerCase()===em)){toast('Essa pessoa já está na equipa',true);return false}
      const btn=document.querySelector('#mf .pri');btn.disabled=true;
      equipaApi({acao:'criar',email:em,papel:pp,senha:pass}).then(async r=>{await loadAll();render();credCard(em,r.conta_nova===false?'(a palavra-passe que a pessoa já tinha)':pass)}).catch(e=>{btn.disabled=false;toast(e.message,true)});
      return false},null,false);
}
function editPw(email){
  const mine=!email;
  modal(mine?'Mudar a minha palavra-passe':'Nova palavra-passe de '+esc(email),inp('Nova palavra-passe (mínimo 8 caracteres)','f_pw',mine?'':genPw(),mine?'password':'text','w'),
    g=>{const pass=g('f_pw');if(pass.length<8){reqName(()=>'','f_pw','Mínimo 8 caracteres');return false}
      const btn=document.querySelector('#mf .pri');btn.disabled=true;
      (mine?sb.auth.updateUser({password:pass}).then(r=>{if(r.error)throw new Error(r.error.message)}):equipaApi({acao:'repor',email,senha:pass})).then(()=>{closeM();if(mine)toast('Palavra-passe atualizada');else credCard(email,pass)}).catch(e=>{btn.disabled=false;toast(e.message,true)});
      return false});
}
function newKey(){
  modal('Criar chave de API',inp('Nome (por exemplo, Loja online)','f_kn','','text','w'),
    g=>{const nome=g('f_kn').slice(0,80);const a=new Uint8Array(24);crypto.getRandomValues(a);
      const key='kamba_'+Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');
      crypto.subtle.digest('SHA-256',new TextEncoder().encode(key)).then(h=>{const hash=Array.from(new Uint8Array(h),b=>b.toString(16).padStart(2,'0')).join('');
        return sb.from('api_chaves').insert({nome,prefixo:key.slice(0,10),hash})}).then(async r=>{if(r.error)throw new Error(r.error.message);await loadAll();render();
          $('#modal').innerHTML=`<div class="ov" data-a="close"><div class="modal"><h2>Chave criada</h2><p class="m" style="font-size:14px">Copia já a chave. Por segurança, não volta a ser mostrada.</p><div class="card" style="font-family:monospace;font-size:13px;word-break:break-all">${esc(key)}</div><div class="acts"><button type="button" class="btn" data-a="copycred" data-t="${esc(key)}">Copiar</button><button type="button" class="btn pri" data-a="close">Feito</button></div></div></div>`}).catch(e=>toast('Não foi possível criar a chave: '+e.message,true));
      return false});
}
function askOut(){
  $('#modal').innerHTML=`<div class="ov" data-a="close"><div class="modal" role="alertdialog" aria-labelledby="outt"><h2 id="outt">Terminar sessão</h2><p style="font-size:15px;margin:0 0 6px">Tens mesmo a certeza que queres terminar a sessão?</p><div class="acts"><button type="button" class="btn" data-a="close">Cancelar</button><button type="button" class="btn bad" data-a="outgo" id="outgo">Sim, terminar sessão</button></div></div></div>`;
  const b=document.getElementById('outgo');b&&b.focus();
}
/* eventos */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,id=el.dataset.id;
  if(a==='close'){if(e.target===el||el.tagName==='BUTTON')closeM();return}
  if(a==='tick')return;
  if(a==='tf'){ui.tf=el.dataset.k;render();return}
  if(a==='askout'||a==='out'){askOut();return}
  if(a==='outgo'){(async()=>{if(queue.length)await save();if(queue.length){closeM();toast('Há alterações por enviar. Liga-te à internet antes de sair.',true);return}lsDel(sKey());lsDel('kamba-last');await sb.auth.signOut();location.replace('index.html')})();return}
  if(a==='copycred'){const t=el.dataset.t;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copiado'),()=>toast('Seleciona e copia manualmente',true));return}
  if(a==='pwm'){editPw(id);return}
  if(a==='mypw'){editPw();return}
  if(a==='newk'){newKey();return}
  if(a==='rmk'){if(!el.dataset.s){el.dataset.s=1;el.textContent='Confirmar';return}sb.from('api_chaves').delete().eq('id',id).then(r=>{if(r.error)toast('Não foi possível apagar',true);else{db.chaves=db.chaves.filter(x=>x.id!==id);render()}});return}
  if(a==='wa'){openWA(id,el.dataset.deal);return}
  if(a==='wago'){const c=db.contacts.find(x=>x.id===id);if(c){c.ultimo_contacto=new Date().toISOString();touch('contacts',c);save()}setTimeout(()=>{closeM();render()},150);return}
  if(a==='qadd'){$('#qitens').insertAdjacentHTML('beforeend',qrow({descricao:'',qtd:1,preco:0}));updTot();return}
  if(a==='qdel'){el.closest('.qi').remove();updTot();return}
  if(a==='qprint'){const f=$('#mf');showDoc(readQuoteForm(f._base||{}));return}
  if(a==='docprint'){window.print();return}
  if(a==='docclose'){$('#doc').hidden=true;$('#doc').innerHTML='';return}
  if(a==='qfromdeal'){closeM();editQuote(null,id);return}
  if(a==='editemp'){editEmpresa();return}
  if(a==='samples'){loadSamples();return}
  if(a==='rmm'){if(!el.dataset.s){el.dataset.s=1;el.textContent='Confirmar';return}equipaApi({acao:'remover',email:id}).then(async()=>{await loadAll();render();toast('Pessoa removida')}).catch(e=>toast(e.message,true));return}
  if(a==='newm'){editMember();return}
  if(a==='rmp'){if(!el.dataset.s){el.dataset.s=1;el.textContent='Confirmar';return}sb.from('pedidos_demo').delete().eq('id',id).then(r=>{if(r.error)toast('Não foi possível remover',true);else{db.pedidos=db.pedidos.filter(x=>x.id!==id);render()}});return}
  ({newq:()=>editQuote(),editq:()=>editQuote(id),newc:()=>editContact(),editc:()=>editContact(id),newd:()=>editDeal(),editd:()=>editDeal(id),newt:()=>editTask(),editt:()=>editTask(id)})[a]?.();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.a==='tick'){const t=db.tasks.find(x=>x.id===el.dataset.id);t.feito=el.checked;touch('tasks',t);save();render()}
  if(el.dataset.a==='mv'){const d=db.deals.find(x=>x.id===el.dataset.id);if(d){d.etapa=el.value;touch('deals',d);save();render()}}
  if(el.dataset.a==='plano'){sb.rpc('definir_plano',{p_empresa:el.dataset.id,p_plano:el.value}).then(r=>{if(r.error)toast('Não foi possível mudar o plano',true);else toast('Plano atualizado')});return}
  if(el.dataset.a==='role'){const m=db.team.find(x=>x.email===el.dataset.id);if(m){m.papel=el.value;touch('team',m);save().then(()=>toast('Papel atualizado'));render()}}
  if(el.id==='st'){ui.st=el.value;listContacts()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;listContacts()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#doc').hidden){$('#doc').hidden=true;$('#doc').innerHTML=''}else closeM()}});
let dragId=null;
document.addEventListener('dragstart',e=>{const d=e.target.closest('.deal');if(d){dragId=d.dataset.id;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}}});
document.addEventListener('dragover',e=>{const c=e.target.closest('.col');if(c&&dragId){e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='move';document.querySelectorAll('.col.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest('.col');if(c&&!c.contains(e.relatedTarget))c.classList.remove('over')});
document.addEventListener('drop',e=>{const c=e.target.closest('.col');if(c&&dragId){e.preventDefault();const d=db.deals.find(x=>x.id===dragId);if(d){d.etapa=c.dataset.stage;touch('deals',d);save()}dragId=null;render()}});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});

/* autenticação */
function showAuth(mode='login',msg='',ok=false){
  $('#app').hidden=true;$('#auth').hidden=false;
  const su=mode==='signup';
  $('#auth').innerHTML=`<div class="authbox card"><div class="brand"><img src="assets/favicon.svg" width="30" height="30" alt="" style="border-radius:8px;flex:none">Kamba CRM</div>
  <h1 style="font-size:22px">${su?'Criar a conta da tua empresa':'Entrar'}</h1>${su?'<p class="m" style="font-size:13px;margin:0 0 6px">Ficas como administrador e crias depois o perfil de cada pessoa da tua equipa.</p>':''}${msg?`<div class="msg ${ok?'ok':''}">${esc(msg)}</div>`:''}
  <form id="af" data-mode="${mode}" novalidate>${su?'<label>Nome da empresa<input id="a_emp" type="text" autocomplete="organization" maxlength="160" required></label>':''}<label>Email<input id="a_em" type="email" autocomplete="email" required></label><label>Palavra-passe<input id="a_pw" type="password" autocomplete="${su?'new-password':'current-password'}" minlength="8" required></label><button class="btn pri" id="a_go">${su?'Criar conta':'Entrar'}</button></form>
  <div class="m">${su?'Já tens conta?':'Ainda não tens conta?'} <button class="link" data-a="authmode" data-m="${su?'login':'signup'}">${su?'Entrar':'Criar conta'}</button></div>
  ${su?'':'<div class="m" style="font-size:12px">Fazes parte de uma equipa? Usa o email e a palavra-passe que o teu administrador te deu.</div>'}
  <div class="m"><a href="index.html">Voltar à página inicial</a></div></div>`;
}
function showCreateCompany(prefill=''){
  $('#app').hidden=true;$('#auth').hidden=false;
  $('#auth').innerHTML=`<div class="authbox card"><div class="brand"><img src="assets/favicon.svg" width="30" height="30" alt="" style="border-radius:8px;flex:none">Kamba CRM</div>
  <h1 style="font-size:22px">Cria a tua empresa</h1><p class="m" style="font-size:13px;margin:0 0 6px">A conta ${esc(me.email)} ainda não pertence a nenhuma empresa. Se és membro de uma equipa, pede ao teu administrador para criar o teu perfil.</p><div id="cc_msg"></div>
  <form id="cf" novalidate><label>Nome da empresa<input id="c_emp" type="text" maxlength="160" value="${esc(prefill)}" required></label><button class="btn pri" id="c_go">Criar empresa</button></form>
  <div class="m"><button class="link" data-a="out">Terminar sessão</button></div></div>`;
}
async function criarEmpresa(nome){
  const{data,error}=await sb.rpc('criar_empresa',{p_nome:nome});
  if(error)throw new Error(error.message.replace(/^.*?:\s*/,''));
  return data;
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='cf')return;e.preventDefault();
  const n=$('#c_emp').value.trim();if(n.length<2){$('#cc_msg').innerHTML='<div class="msg">Indica o nome da empresa.</div>';return}
  $('#c_go').disabled=true;
  try{await criarEmpresa(n);const{data:{session}}=await sb.auth.getSession();enter(session)}catch(err){$('#cc_msg').innerHTML='<div class="msg">'+esc(err.message)+'</div>';$('#c_go').disabled=false}
});
function showNoAccess(){showCreateCompany('')}
function useSnapshot(){
  let sn=null;try{sn=JSON.parse(lsGet(sKey())||'null')}catch(e){}
  if(!sn){showAuth('login','Sem ligação e sem dados guardados neste aparelho. Liga-te à internet para entrar.');return false}
  db=Object.assign(DB0(),sn.db);me.papel=sn.me.papel;me.plataforma=!!sn.me.plataforma;offline=true;return true;
}
async function enter(session){
  me.email=session.user.email;
  let papel=null;
  if(navigator.onLine){
    const{data,error}=await sb.rpc('reclamar_conta');
    if(error&&!isNet(error)){showAuth('login','Erro ao verificar o acesso: '+error.message);return}
    if(!error){
      papel=data;
      if(papel==='sem_sessao'){showAuth('login');return}
      if(papel==='sem_empresa'){
        const nome=((session.user.user_metadata||{}).empresa||'').trim();
        if(nome.length>=2){try{papel=await criarEmpresa(nome)}catch(err){showCreateCompany(nome);return}}
        else{showCreateCompany('');return}
      }
      try{const pl=await sb.rpc('eh_plataforma');me.plataforma=pl.data===true}catch(e){}
    }
  }
  try{queue=JSON.parse(lsGet(qKey())||'[]')}catch(e){queue=[]}
  if(papel){
    me.papel=papel;
    if(queue.length)await save();
    if(!await loadAll()&&!useSnapshot())return;
  }else if(!useSnapshot())return;
  $('#who').textContent=me.email+' ('+(PAPEL[me.papel]||me.papel).toLowerCase()+')';
  $('#auth').hidden=true;$('#app').hidden=false;netBanner();
  if(location.hash==='#entrar'||location.hash==='#criar')history.replaceState(null,'',location.pathname);
  route();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a="authmode"]');if(b)showAuth(b.dataset.m)});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='af')return;e.preventDefault();
  const mode=e.target.dataset.mode,em=$('#a_em').value.trim(),pw=$('#a_pw').value,emp=mode==='signup'?$('#a_emp').value.trim():'';
  if(!em||pw.length<8){showAuth(mode,'Indica o email e uma palavra-passe com pelo menos 8 caracteres.');return}
  if(mode==='signup'&&emp.length<2){showAuth(mode,'Indica o nome da tua empresa.');return}
  $('#a_go').disabled=true;
  if(mode==='signup'){
    const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname,data:{empresa:emp}}});
    if(error){showAuth('signup',error.message);return}
    if(data.session){enter(data.session);return}
    showAuth('login','Enviámos um email de confirmação para '+em+'. Abre o link e depois entra aqui.',true);
  }else{
    const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
    if(error){showAuth('login',/confirm/i.test(error.message)?'Confirma primeiro o teu email, pelo link que enviámos.':'Email ou palavra-passe incorretos.');return}
    enter(data.session);
  }
});
sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'){db=DB0();queue=[];offline=false;netBanner();location.replace('index.html')}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
addEventListener('online',()=>{sync()});
addEventListener('offline',()=>{offline=true;netBanner()});
setInterval(()=>{if(queue.length&&navigator.onLine)sync()},30000);
(async()=>{
  let ses=null;try{ses=(await sb.auth.getSession()).data.session}catch(e){}
  if(ses)enter(ses);
  else if(!navigator.onLine&&lsGet('kamba-last'))enter({user:{email:lsGet('kamba-last')}});
  else if(location.hash==='#entrar')showAuth('login');
  else if(location.hash==='#criar')showAuth('signup');
  else location.replace('index.html');
})();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
</script>
