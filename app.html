<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kamba CRM</title>
<meta name="theme-color" content="#0d7a6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://dywzfjrisvgkujamueql.supabase.co" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"></noscript>
<style>
/* Layout: barra lateral fixa + área de trabalho; em ecrãs estreitos a barra passa para o topo */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --fg:#13201e; --muted:#5d6e6b; --line:#dce4e3;
  --accent:#0d7a6e; --accent-ink:#ffffff; --accent-soft:#dff1ee;
  --good:#1a7f4b; --good-soft:#dcf2e5; --warn:#a15c07; --warn-soft:#fbecd2; --bad:#b4332b; --bad-soft:#fbe0dd;
  --shadow:0 1px 2px rgba(19,32,30,.06),0 8px 24px rgba(19,32,30,.06);
  --f-display:'Space Grotesk',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1716; --surface:#152220; --fg:#e6f0ee; --muted:#93a8a4; --line:#263a37;
  --accent:#3fc5b4; --accent-ink:#06211d; --accent-soft:#18403b;
  --good:#5fd394; --good-soft:#163a28; --warn:#f0b75a; --warn-soft:#3d2d10; --bad:#ff8c82; --bad-soft:#431b18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1716; --surface:#152220; --fg:#e6f0ee; --muted:#93a8a4; --line:#263a37;
  --accent:#3fc5b4; --accent-ink:#06211d; --accent-soft:#18403b;
  --good:#5fd394; --good-soft:#163a28; --warn:#f0b75a; --warn-soft:#3d2d10; --bad:#ff8c82; --bad-soft:#431b18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);margin:0;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto;padding-block:20px}
.side{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font:700 18px var(--f-display)}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand svg{width:16px;height:16px;stroke:var(--accent-ink);fill:none;stroke-width:2.2}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
nav a:hover{background:var(--accent-soft);color:var(--fg)}
nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav a .n{margin-left:auto;font-size:12px;opacity:.85}
.note{font-size:12px;color:var(--muted);line-height:1.45}
main{min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:26px}
.head p{margin:2px 0 0;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font:700 26px var(--f-display);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px}
.card h2{font-size:16px;margin-bottom:12px}
.fun{display:grid;gap:10px}
.fun .r{display:grid;grid-template-columns:110px 1fr 110px;gap:10px;align-items:center}
.fun .bar{height:22px;background:var(--bg);border-radius:6px;overflow:hidden}
.fun .bar b{display:block;height:100%;background:var(--accent);border-radius:6px;min-width:4px}
.fun .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.fun .cnt{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.list .it:first-child{border-top:0}
.grow{flex:1;min-width:0}
.t{font-weight:500;overflow-wrap:anywhere}
.m{color:var(--muted);font-size:12px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.mut{background:var(--bg);color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.tools input{flex:1;min-width:180px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-top:1px solid var(--line)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--accent-soft)}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:280px}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col h3{font-size:14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col .tot{font-size:12px;color:var(--muted);font-weight:400;font-family:var(--f-body)}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:grab;box-shadow:var(--shadow)}
.deal:active{cursor:grabbing}
.mv{display:none;margin-top:8px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
@media (hover:none){.mv{display:block}}
.deal .val{font:600 15px var(--f-display);margin-top:6px;font-variant-numeric:tabular-nums}
.tk{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.tk:first-child{border-top:0}
.tk input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.tk.done .t{text-decoration:line-through;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(8,16,15,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;z-index:20}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;padding:20px;margin-top:4vh;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal h2{font-size:20px;margin-bottom:14px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fg label.w{grid-column:1/-1}
.fg input,.fg select,.fg textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);font-size:14px;min-width:0;width:100%}
.fg textarea{min-height:70px;resize:vertical}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.acts .sp{margin-right:auto}
.rel{margin-top:14px;font-size:12px;color:var(--muted)}
@media (max-width:860px){
  .app{grid-template-columns:170px minmax(0,1fr);gap:16px}
  .note{display:none}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .fun .r{grid-template-columns:90px 1fr 90px}
  .fg{grid-template-columns:1fr}
}

/* telemóvel: interface própria (até 700px) */
.mtop,#tabbar,#fab,.ccards,.stgs{display:none}
.mob .side{display:none}
.mob .app{grid-template-columns:minmax(0,1fr);gap:0;padding-block:0}
.mob main{padding:12px 0 calc(150px + env(safe-area-inset-bottom,0px))}
.mob .mtop{display:flex;align-items:center;gap:10px;font:600 16px var(--f-display);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;margin:0 -16px;border-bottom:1px solid var(--line);background:var(--surface)}
.mob .mtop span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mob #tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--surface);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.mob #tabbar a,.mob #tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;border:0;background:none;color:var(--muted);font:500 11px var(--f-body);text-decoration:none;position:relative;cursor:pointer;padding:6px 0}
.mob #tabbar [aria-current="page"]{color:var(--accent)}
.mob #tabbar [aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.mob #tabbar .n{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.mob #fab{display:grid;place-items:center;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:11;cursor:pointer}
.mob #fab[hidden]{display:none}
.mob .head{margin-bottom:10px}
.mob .head h1{font-size:20px}
.mob .head p{font-size:13px}
.mob .head .acts,.mob .head>.btn{display:none}
.mob .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mob .kpi .v{font-size:20px}
.mob .btn,.mob .tools input,.mob .tools select{min-height:44px}
.mob .tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:0 0 6px}
.mob .tools input,.mob .tools select{min-width:0;flex:1 1 100%;font-size:16px}
.mob .tw{display:none}
.mob .ccards{display:flex;flex-direction:column;gap:10px}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.cc-top{display:flex;gap:10px;align-items:center;min-width:0}
.cc-top .grow{min-width:0;flex:1}
.cc-top .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-top .m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-top input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.cc-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cc-act{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.cc-act .wa{margin:0;min-height:44px;justify-content:center;border-radius:10px;font-size:13px;font-weight:500;text-decoration:none;color:var(--fg)}
.mob .stgs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 10px;padding:2px 16px 6px;-webkit-overflow-scrolling:touch}
.mob .stgs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;min-height:40px;font:500 13px var(--f-body);color:var(--fg);cursor:pointer;display:flex;gap:6px;align-items:center}
.mob .stgs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mob .board{display:block;overflow:visible}
.mob .col{min-height:0;background:transparent;border:0;padding:0}
.mob .deal{cursor:default;padding:12px 14px}
.mob .mv{display:block;min-height:44px;font-size:16px}
.mob .deal .wa{min-height:40px}
.mob .tk input[type=checkbox]{width:24px;height:24px}
.mob .seg button{min-height:40px}
.mob .ov{align-items:flex-end;padding:0}
.mob .modal{margin:0;max-width:none!important;border-radius:18px 18px 0 0;max-height:92vh;max-height:92dvh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.mob .fg input,.mob .fg select,.mob .fg textarea{font-size:16px;padding:11px 12px}
.mob .acts .btn{flex:1 1 auto}
.mob #toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.sheet .sb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:14px 4px;font:500 15px var(--f-body);color:var(--fg);cursor:pointer}
.sheet .sb.bad{color:var(--bad)}
.sheet .sb:first-of-type{border-top:0}
@media (prefers-reduced-motion:no-preference){.card,.deal{transition:border-color .15s}}

[hidden]{display:none!important}
#auth{min-height:100vh;display:grid;place-items:center;padding:24px 0}
.authbox{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.authbox form{display:flex;flex-direction:column;gap:12px}
.authbox label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.authbox input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;width:100%}
.authbox .msg{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.authbox .msg.ok{background:var(--good-soft);color:var(--good)}
.pbar{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:12px}.pbar.bad{background:var(--bad-soft);color:var(--bad)}.pbar a{color:inherit;font-weight:600}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500}
.who{display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted)}
.who span{overflow-wrap:anywhere}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:40;max-width:90vw}
#toast.bad{background:var(--bad);color:#fff}

#net{position:sticky;top:0;z-index:15;background:var(--warn-soft);color:var(--warn);padding:8px 16px;font-size:13px;text-align:center;margin-inline:-16px}
.fg div.w{grid-column:1/-1}
.modal.wide{max-width:780px}
.wa{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 9px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:12px;margin-top:6px;color:var(--accent);font-weight:500}
.wa:hover{border-color:var(--accent)}
.qh,.qi{display:grid;grid-template-columns:minmax(0,1fr) 72px 120px 36px;gap:6px;align-items:center}
.qh{font-size:12px;color:var(--muted);margin-bottom:4px}
.qi{margin-bottom:6px}
.qi input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);min-width:0;width:100%}
.qi .btn{padding:6px 0}
#qtot{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13px}
.doc-ov{position:fixed;top:0;right:0;bottom:0;left:0;background:#dfe6e5;z-index:50;overflow:auto;padding:12px}
.doc-tools{max-width:794px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.doc-tools .m{color:#566865}
.doc{background:#fff;color:#111;max-width:794px;margin:12px auto;padding:44px;box-shadow:0 2px 24px rgba(0,0,0,.12);font:14px/1.5 Inter,system-ui,sans-serif}
.doc h1{font:700 26px 'Space Grotesk',system-ui,sans-serif;margin:0;color:#0b4f48;letter-spacing:.02em}
.doc .dh{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.doc .dh>div{min-width:0}
.doc .dh .emp b{font-size:17px}
.doc .meta{text-align:right}
.doc .cli{margin-bottom:20px;padding:12px 14px;background:#f3f6f6;border-radius:8px}
.doc h2{font:600 16px 'Space Grotesk',system-ui,sans-serif;margin:0 0 10px;color:#111}
.doc .dt{overflow-x:auto}
.doc table{width:100%;border-collapse:collapse;min-width:0}
.doc th{background:#0b4f48;color:#fff;text-align:left;font-size:12px;padding:8px 10px;text-transform:none;letter-spacing:0}
.doc td{padding:8px 10px;border-top:1px solid #dfe6e5;color:#111}
.doc .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc tbody tr{cursor:default}.doc tbody tr:hover{background:none}
.doc .tt{margin:14px 0 0 auto;width:min(320px,100%)}
.doc .tt div{display:flex;justify-content:space-between;padding:4px 10px;font-variant-numeric:tabular-nums}
.doc .tt .g{background:#0b4f48;color:#fff;font-weight:700;border-radius:6px;margin-top:4px;padding:8px 10px}
.doc .cond{margin-top:24px;font-size:13px;white-space:pre-wrap}
.doc .fiscal{margin-top:28px;font-size:12px;color:#566865;border-top:1px solid #dfe6e5;padding-top:10px}
.doc .aviso{background:#fbecd2;color:#7a4a00;padding:8px 12px;border-radius:8px;margin-bottom:16px;font-size:13px}
@media (max-width:600px){.doc{padding:20px}.qh,.qi{grid-template-columns:minmax(0,1fr) 58px 92px 32px}}
@media print{
  body>*:not(#doc){display:none!important}
  #doc{position:static!important;background:#fff!important;padding:0!important;overflow:visible!important}
  .doc-tools,.no-print{display:none!important}
  .doc{box-shadow:none!important;margin:0!important;padding:0!important;max-width:none!important}
  .doc th,.doc .tt .g{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{margin:16mm}
}
</style>

</head>
<body>
<div id="net" role="status" hidden></div>
<div id="auth"><div class="authbox card"><div class="brand"><img src="assets/favicon.svg" width="30" height="30" alt="" style="border-radius:8px;flex:none">Kamba CRM</div><p class="m" style="font-size:14px;margin:0">A carregar…</p></div></div>
<div class="app" id="app" hidden>
  <header class="mtop" id="mtop"></header>
  <aside class="side">
    <div class="brand"><img src="assets/favicon.svg" width="30" height="30" alt="" style="border-radius:8px;flex:none">Kamba CRM</div>
    <nav id="nav"></nav>
    <div class="who"><span id="who"></span><button class="btn" data-a="perfil">O meu perfil</button><button class="btn" data-a="out">Sair</button><a class="link" href="index.html" style="text-decoration:none">Página de vendas</a></div>
  </aside>
  <main id="main"></main>
  <nav id="tabbar" aria-label="Navegação"></nav>
  <button type="button" id="fab" data-a="fab" aria-label="Novo" hidden>+</button>

/* CSV: importar e exportar */
const noAcc=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function parseCSV(t){
  t=String(t).replace(/^﻿/,'');
  const l1=t.split(/\r?\n/)[0]||'';
  const d=l1.split(';').length>l1.split(',').length?';':(l1.includes('\t')&&!l1.includes(',')?'\t':',');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===d){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else cur+=c;
  }
  row.push(cur);if(row.some(x=>x.trim()))rows.push(row);
  return rows;
}
const COLS={nome:['nome','name','cliente','nomecompleto'],empresa:['empresa','company','organizacao'],cargo:['cargo','funcao'],email:['email','mail','correio','emailaddress'],tel:['telefone','tel','telemovel','whatsapp','phone','celular','contacto'],cidade:['cidade','city','localidade'],estado:['estado','status','tipo'],notas:['notas','nota','observacoes','obs','notes'],origem:['origem','fonte','source','canal']};
function csvContacts(text){
  const rows=parseCSV(text);if(rows.length<2)return{erro:'O ficheiro está vazio ou só tem o cabeçalho.'};
  const head=rows[0].map(noAcc),idx={};
  for(const[k,al]of Object.entries(COLS)){const i=head.findIndex(h=>al.includes(h));if(i>=0)idx[k]=i}
  if(idx.nome==null)return{erro:'Não encontrei a coluna "Nome". A primeira linha deve ter os títulos das colunas (Nome, Empresa, Email, Telefone...).'};
  const seenE=new Set(db.contacts.map(c=>(c.email||'').toLowerCase()).filter(Boolean)),seenT=new Set(db.contacts.map(c=>waNum(c.tel)).filter(Boolean));
  const ok=[];let semNome=0,dup=0,excesso=0;
  for(const r of rows.slice(1)){
    const g=k=>idx[k]==null?'':String(r[idx[k]]==null?'':r[idx[k]]).trim();
    const nome=g('nome');if(!nome){semNome++;continue}
    const email=g('email').toLowerCase(),tel=g('tel'),tn=waNum(tel);
    if((email&&seenE.has(email))||(tn&&seenT.has(tn))){dup++;continue}
    if(ok.length>=2000){excesso++;continue}
    if(email)seenE.add(email);if(tn)seenT.add(tn);
    const est=STATUS.find(x=>noAcc(x)===noAcc(g('estado')))||'Lead';
    ok.push({id:uid(),nome:nome.slice(0,200),empresa:g('empresa').slice(0,200),cargo:g('cargo').slice(0,200),email:email.slice(0,200),tel:tel.slice(0,60),cidade:g('cidade').slice(0,100),estado:est,origem:ORIGENS.find(x=>noAcc(x)===noAcc(g('origem')))||'',notas:g('notas').slice(0,2000),responsavel:me.email});
  }
  return{ok,semNome,dup,excesso};
}
function importContacts(file){
  if(bloqueado())return;
  const fr=new FileReader();
  fr.onload=()=>{
    const r=csvContacts(fr.result);
    if(r.erro){toast(r.erro,true);return}

}
function csvCell(v){let t=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(t))t="'"+t;return/[;"\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}
function downloadCSV(nome,cab,linhas){

function waFill(txt,c,d){

async function equipaApi(body){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)throw new Error('Sessão expirada. Entra outra vez.');
  let r;try{r=await fetch(SB_URL+'/functions/v1/equipa',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token,apikey:SB_KEY},body:JSON.stringify(body)})}catch(e){throw new Error('Sem ligação à internet. Tenta outra vez quando estiveres online.')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.erro||'Não foi possível concluir');
  return j;
}

function newKey(){
  modal('Criar chave de API',inp('Nome (por exemplo, Loja online)','f_kn','','text','w'),
    g=>{const nome=g('f_kn').slice(0,80);const a=new Uint8Array(24);crypto.getRandomValues(a);
      const key='kamba_'+Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');
      crypto.subtle.digest('SHA-256',new TextEncoder().encode(key)).then(h=>{const hash=Array.from(new Uint8Array(h),b=>b.toString(16).padStart(2,'0')).join('');
        return sb.from('api_chaves').insert({nome,prefixo:key.slice(0,10),hash})}).then(async r=>{if(r.error)throw new Error(r.error.message);await loadAll();render();
          $('#modal').innerHTML=`<div class="ov" data-a="close"><div class="modal"><h2>Chave criada</h2><p class="m" style="font-size:14px">Copia já a chave. Por segurança, não volta a ser mostrada.</p><div class="card" style="font-family:monospace;font-size:13px;word-break:break-all">${esc(key)}</div><div class="acts"><button type="button" class="btn" data-a="copycred" data-t="${esc(key)}">Copiar</button><button type="button" class="btn pri" data-a="close">Feito</button></div></div></div>`}).catch(e=>toast('Não foi possível criar a chave: '+e.message,true));

  $('#r_go').disabled=true;
  const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
  if(error&&/rate|seconds|many/i.test(error.message)){showForgot('Já pediste um link há pouco tempo. Espera um minuto e tenta outra vez.');return}
  showForgot('Se este email tiver conta, enviámos um link. Abre o email e segue as instruções.',true);
});
function showNewPw(msg=''){
  $('#app').hidden=true;$('#auth').hidden=false;
  $('#auth').innerHTML=`<div class="authbox card"><div class="brand"><img src="assets/favicon.svg" width="30" height="30" alt="" style="border-radius:8px;flex:none">Kamba CRM</div>
  <h1 style="font-size:22px">Nova palavra-passe</h1>${msg?`<div class="msg">${esc(msg)}</div>`:''}
  <form id="nf" novalidate><label>Nova palavra-passe (mínimo 8 caracteres)<input id="n_pw" type="password" autocomplete="new-password" minlength="8" required></label><label>Repete a palavra-passe<input id="n_pw2" type="password" autocomplete="new-password" required></label><button class="btn pri" id="n_go">Guardar e entrar</button></form></div>`;
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='nf')return;e.preventDefault();
  const a=$('#n_pw').value,b=$('#n_pw2').value;
  if(a.length<8){showNewPw('A palavra-passe tem de ter pelo menos 8 caracteres.');return}
  if(a!==b){showNewPw('As palavras-passe não são iguais.');return}
  $('#n_go').disabled=true;
  const{error}=await sb.auth.updateUser({password:a});
  if(error){showNewPw(error.message);return}
  history.replaceState(null,'',location.pathname);
  const{data:{session}}=await sb.auth.getSession();
  if(session)enter(session);else showAuth('login','Palavra-passe atualizada. Já podes entrar.',true);
});
function showCreateCompany(m){
  const M=typeof m==='string'?{empresa:m}:(m||{});
  $('#app').hidden=true;$('#auth').hidden=false;
  $('#auth').innerHTML=`<div class="authbox card"><div class="brand"><img src="assets/favicon.svg" width="30" height="30" alt="" style="border-radius:8px;flex:none">Kamba CRM</div>
  <h1 style="font-size:22px">Cria a tua empresa</h1><p class="m" style="font-size:13px;margin:0 0 6px">A conta ${esc(me.email)} ainda não pertence a nenhuma empresa. Se és membro de uma equipa, pede ao teu administrador para criar o teu perfil.</p><div id="cc_msg"></div>
  <form id="cf" novalidate><label>Nome completo<input id="c_nome" type="text" maxlength="160" value="${esc(M.nome||'')}" required></label><label>Nº do BI<input id="c_bi" type="text" autocapitalize="characters" maxlength="20" placeholder="000123456LA041" value="${esc(M.bi||'')}" required></label><label>Telefone<input id="c_tel" type="tel" maxlength="25" value="${esc(M.tel||'')}" required></label><label>Nome da empresa<input id="c_emp" type="text" maxlength="160" value="${esc(M.empresa||'')}" required></label><label>Responsável da empresa<input id="c_resp" type="text" maxlength="160" placeholder="Deixa vazio se és tu" value="${esc(M.responsavel&&M.responsavel!==M.nome?M.responsavel:'')}"></label><button class="btn pri" id="c_go">Criar empresa</button></form>
  <div class="m"><button class="link" data-a="out">Terminar sessão</button></div></div>`;
}
async function criarEmpresa(m){
  const{data,error}=await sb.rpc('criar_empresa',{p_nome:m.empresa,p_responsavel:m.responsavel||m.nome,p_nome_completo:m.nome,p_bi:m.bi,p_telefone:m.tel});
  if(error)throw new Error(error.message.replace(/^.*?:\s*/,''));
  return data;
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='cf')return;e.preventDefault();
  const n=$('#c_emp').value.trim(),m={empresa:n,nome:$('#c_nome').value.trim(),bi:$('#c_bi').value.trim(),tel:$('#c_tel').value.trim(),responsavel:$('#c_resp').value.trim()};
  const er=chkPessoa(m.nome,m.bi,m.tel)||(n.length<2?'Indica o nome da empresa.':'');if(er){$('#cc_msg').innerHTML='<div class="msg">'+esc(er)+'</div>';return}
  if(!m.responsavel)m.responsavel=m.nome;
  $('#c_go').disabled=true;
  try{await criarEmpresa(m);const{data:{session}}=await sb.auth.getSession();enter(session)}catch(err){$('#cc_msg').innerHTML='<div class="msg">'+esc(err.message)+'</div>';$('#c_go').disabled=false}
});
function showNoAccess(){showCreateCompany('')}
function useSnapshot(){
  let sn=null;try{sn=JSON.parse(lsGet(sKey())||'null')}catch(e){}
  if(!sn){showAuth('login','Sem ligação e sem dados guardados neste aparelho. Liga-te à internet para entrar.');return false}
  db=Object.assign(DB0(),sn.db);me.papel=sn.me.papel;me.plataforma=!!sn.me.plataforma;offline=true;return true;
}
function showApp(){
  $('#who').textContent=(myPerfil().nome?myPerfil().nome+' · ':'')+me.email+' ('+(PAPEL[me.papel]||me.papel).toLowerCase()+')';
  $('#auth').hidden=true;$('#app').hidden=false;netBanner();
  if(location.hash==='#entrar'||location.hash==='#criar')history.replaceState(null,'',location.pathname);
  route();
  if(!offline&&!ui.askedPerfil&&me.papel&&!myPerfil().nome){ui.askedPerfil=1;setTimeout(()=>{if(!$('#modal').innerHTML&&!$('#app').hidden)editPerfil()},700)}
}
async function enter(session){
  me.email=session.user.email;
  try{queue=JSON.parse(lsGet(qKey())||'[]')}catch(e){queue=[]}
  // mostra logo os dados guardados neste aparelho e atualiza em segundo plano
  let shown=false;
  try{const sn=JSON.parse(lsGet(sKey())||'null');if(sn&&sn.me&&sn.me.papel&&sn.db){db=Object.assign(DB0(),sn.db);me.papel=sn.me.papel;me.plataforma=!!sn.me.plataforma;shown=true;showApp()}}catch(e){}
  let papel=null;
  if(navigator.onLine){
    const[rc,pl]=await Promise.all([sb.rpc('reclamar_conta'),sb.rpc('eh_plataforma')]);
    const{data,error}=rc;
    if(error&&!isNet(error)){showAuth('login','Erro ao verificar o acesso: '+error.message);return}
    if(!error){
      papel=data;
      if(papel==='sem_sessao'){showAuth('login');return}
      if(papel==='sem_empresa'){
        const md=session.user.user_metadata||{},m={empresa:String(md.empresa||'').trim(),nome:String(md.nome||'').trim(),bi:String(md.bi||'').trim(),tel:String(md.tel||'').trim(),responsavel:String(md.responsavel||'').trim()};
        if(m.empresa.length>=2&&!chkPessoa(m.nome,m.bi,m.tel)){try{papel=await criarEmpresa(m)}catch(err){showCreateCompany(m);return}}
        else{showCreateCompany(m);return}
      }
      me.plataforma=!pl.error&&pl.data===true;
    }
  }
  if(papel){
    me.papel=papel;
    if(queue.length)await save();
    if(!await loadAll()){if(!shown&&!useSnapshot())return}
  }else{if(shown)offline=true;else if(!useSnapshot())return}
  showApp();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a="authmode"]');if(b)showAuth(b.dataset.m)});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='af')return;e.preventDefault();
  const mode=e.target.dataset.mode,em=$('#a_em').value.trim(),pw=$('#a_pw').value,emp=mode==='signup'?$('#a_emp').value.trim():'';
  if(mode==='signup'){AK={nome:$('#a_nome').value.trim(),bi:$('#a_bi').value.trim(),tel:$('#a_tel').value.trim(),emp,resp:$('#a_resp').value.trim(),em}}
  if(!em||pw.length<8){showAuth(mode,'Indica o email e uma palavra-passe com pelo menos 8 caracteres.');return}
  if(mode==='signup'){const er=chkPessoa(AK.nome,AK.bi,AK.tel);if(er){showAuth(mode,er);return}}
  if(mode==='signup'&&emp.length<2){showAuth(mode,'Indica o nome da tua empresa.');return}
  $('#a_go').disabled=true;
  if(mode==='signup'){
    const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname,data:{empresa:emp,responsavel:AK.resp||AK.nome,nome:AK.nome,bi:AK.bi,tel:AK.tel}}});
    if(error){showAuth('signup',error.message);return}
    AK={};
    if(data.session){enter(data.session);return}
    showAuth('login','Enviámos um email de confirmação para '+em+'. Abre o link e depois entra aqui.',true);
  }else{
    const{data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
    if(error){showAuth('login',/confirm/i.test(error.message)?'Confirma primeiro o teu email, pelo link que enviámos.':'Email ou palavra-passe incorretos.');return}
    enter(data.session);
  }
});
sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){showNewPw();return}if(ev==='SIGNED_OUT'){db=DB0();queue=[];offline=false;netBanner();location.replace('index.html')}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ui.callPending&&!$('#app').hidden){const cid=ui.callPending;ui.callPending=null;setTimeout(()=>{if(!$('#modal').innerHTML)logContact(cid,'chamada')},400)}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(queue.length||Date.now()-lastLoad>60000))sync()});
addEventListener('online',()=>{sync()});
addEventListener('offline',()=>{offline=true;netBanner()});
setInterval(()=>{if(queue.length&&navigator.onLine)sync()},30000);
(async()=>{
  let ses=null;try{ses=(await sb.auth.getSession()).data.session}catch(e){}
  if(RECOVERY){if(ses)showNewPw();else showAuth('login','O link expirou ou já foi usado. Pede outro em "Esqueci a palavra-passe".');return}
  if(ses)enter(ses);
  else if(!navigator.onLine&&lsGet('kamba-last'))enter({user:{email:lsGet('kamba-last')}});
  else if(location.hash==='#entrar')showAuth('login');
  else if(location.hash==='#criar')showAuth('signup');
  else location.replace('index.html');
})();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
</script>
